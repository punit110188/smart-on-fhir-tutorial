<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Example-SMART-App</title>
  <link rel="stylesheet" href="./src/css/example-smart-app.css" />
  <script src="./lib/js/fhir-client-v0.1.12.js"></script>
  <script src="./lib/js/fhir-client-cerner-additions-1.0.0.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="./src/js/example-smart-app.js"></script>
</head>
<body>
  <div id="loading">Loading patient data...</div>
<div id="holder" style="display:none;">
  <h2>Patient Info</h2>
  <p><strong>First Name:</strong> <span id="fname"></span></p>
  <p><strong>Last Name:</strong> <span id="lname"></span></p>
  <p><strong>Gender:</strong> <span id="gender"></span></p>
  <p><strong>Birthdate:</strong> <span id="birthdate"></span></p>
  <p><strong>Height:</strong> <span id="height"></span></p>
  <p><strong>Systolic BP:</strong> <span id="systolicbp"></span></p>
  <p><strong>Diastolic BP:</strong> <span id="diastolicbp"></span></p>
  <p><strong>LDL:</strong> <span id="ldl"></span></p>
  <p><strong>HDL:</strong> <span id="hdl"></span></p>
</div>

<div id="trials" style="display:none;">
  <h3>Matching Clinical Trials</h3>
  <div id="trials-list"></div>
</div>

  <script>
    const clientId = '25fca8a6-a13d-42b4-8cb7-23f23c1b1b12';
    const redirectUri = 'https://punit110188.github.io/smart-on-fhir-tutorial/example-smart-app/launch.html';

    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');

    if (!code) {
      // Initial launch
      const iss = params.get('iss');
      FHIR.oauth2.authorize({
        client_id: clientId,
        scope: 'launch patient/Patient.read patient/Observation.read openid profile online_access',
        redirect_uri: redirectUri,
        iss: iss
      });
    } else {
      // Redirect phase - ready to use FHIR client
      FHIR.oauth2.ready(function(client) {
  extractData().then(drawVisualization).catch(error => {
    console.error("Data Extraction Error:", error);
    document.body.innerHTML = `<p style="color:red">Failed to load patient data.</p>`;
  });
}).catch(error => {
        console.error("OAuth2 Error:", error);
        document.body.innerHTML = `<p style="color:red">Failed to load FHIR client.</p>`;
      });
    }
  </script>
</body>
</html>
